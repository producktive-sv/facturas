<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>proDUCKtive · Gestor de Facturación</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐤</text></svg>">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="view-login" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-logo">🐤</div>
    <h1>proDUCKtive</h1>
    <p class="login-sub">Gestor de Facturación</p>
    <input type="email" id="login-email" placeholder="Correo" autocomplete="email">
    <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password">
    <div id="login-error" class="alert alert-danger hidden"></div>
    <button id="btn-login" class="btn btn-primary btn-block">Entrar</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="view-app" class="app hidden">
  <nav class="navbar">
    <div class="nav-brand">🐤 proDUCKtive <span class="nav-brand-sub">facturación</span></div>
    <div class="nav-links">
      <a href="#/dashboard" data-nav="dashboard">Panel</a>
      <a href="#/facturas" data-nav="facturas">Facturas</a>
      <a href="#/nueva" data-nav="nueva" class="nav-cta">+ Nueva</a>
      <a href="#/clientes" data-nav="clientes">Clientes</a>
      <a href="#/recibidas" data-nav="recibidas">Recibidas</a>
      <a href="#/config" data-nav="config">Config</a>
    </div>
    <div class="nav-user">
      <span id="nav-user-email"></span>
      <button id="btn-logout" class="btn btn-small">Salir</button>
    </div>
  </nav>

  <div id="modo-banner" class="banner hidden"></div>

  <main id="app-main"></main>
</div>

<!-- ============ ZONA DE IMPRESIÓN (factura) ============ -->
<div id="print-area" class="print-only"></div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
